name: Météo CNews Patrick Automatique

on:
  workflow_dispatch:
    inputs:
      triggered_by:
        description: "Qui déclenche ? (gregory = Gregory seulement, patrick = Patrick + Gregory en copie)"
        required: false
        default: "gregory"

permissions:
  contents: write

jobs:
  # ÉTAPE 1 : Génération des 4 bulletins Patrick (HDF + France, Paysage + Portrait)
  generate-videos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group:
          - france_pictos
          - hdf
      fail-fast: false

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer FFmpeg et Polices Emoji (requis pour la compilation vidéo)
        # Garde-fou : un runner GitHub figé bloquait 6 h sans cette limite
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 -o Acquire::http::Timeout=30 ffmpeg fonts-noto-color-emoji

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer Playwright Chromium (pour les captures de cartes)
        run: |
          playwright install chromium

      - name: Generer les cartes pour le groupe (Jours 5, Orientations Paysage et Portrait)
        env:
          PYTHONUNBUFFERED: "1"
          CHROME_PATH: "/usr/bin/google-chrome"
        run: |
          # 1. Cartes & Vidéo Paysage
          python meteo_cnews_2/generate_meteofrance_maps.py --zone ${{ matrix.group }} --days 5 --orientation landscape --patrick --temp-highlight
          python meteo_cnews_2/generate_video_bulletin.py --zone ${{ matrix.group }} --days 5 --orientation landscape --patrick --skip-maps
          
          # 2. Cartes & Vidéo Portrait (TikTok)
          python meteo_cnews_2/generate_meteofrance_maps.py --zone ${{ matrix.group }} --days 5 --orientation portrait --patrick --temp-highlight
          python meteo_cnews_2/generate_video_bulletin.py --zone ${{ matrix.group }} --days 5 --orientation portrait --patrick --skip-maps

      - name: Téléverser les vidéos et cartes générées pour ce groupe
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.group }}
          path: |
            cartes_alertes/bulletin_${{ matrix.group }}_*.mp4
            cartes_alertes/*.jpg
          retention-days: 1

  # ÉTAPE 2 : Rassemblement, auto-vérification, création du ZIP et envoi
  finalize-bulletins:
    runs-on: ubuntu-latest
    needs: generate-videos

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer FFmpeg (requis pour ffprobe)
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 -o Acquire::http::Timeout=30 ffmpeg

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Télécharger toutes les vidéos générées en parallèle
        uses: actions/download-artifact@v4
        with:
          path: cartes_alertes/
          merge-multiple: true

      - name: Vérifier la présence des 4 bulletins attendus (FFprobe)
        run: |
          DATE=$(python -c "import datetime; d=datetime.date.today()+datetime.timedelta(days=1); print(d.strftime('%Y_%m_%d'))")
          MISSING=0
          for FILE in \
            cartes_alertes/bulletin_france_pictos_patrick_landscape_${DATE}.mp4 \
            cartes_alertes/bulletin_france_pictos_patrick_portrait_${DATE}.mp4 \
            cartes_alertes/bulletin_hdf_patrick_landscape_${DATE}.mp4 \
            cartes_alertes/bulletin_hdf_patrick_portrait_${DATE}.mp4; do
            if [ ! -f "$FILE" ]; then
              echo "ABSENT : $FILE"
              MISSING=$((MISSING+1))
            else
              DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$FILE" 2>/dev/null || echo 0)
              echo "OK : $(basename $FILE) (${DURATION}s)"
            fi
          done
          if [ $MISSING -gt 0 ]; then echo "$MISSING bulletin(s) manquant(s)."; exit 1; fi
          echo "Les 4 bulletins Patrick sont valides."

      - name: Créer le fichier ZIP, générer les textes IA et envoyer l'e-mail
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_EMAIL: "langlet.gregory@gmail.com"
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TEST_MODE: "${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.triggered_by == 'patrick') && 'false' || 'true' }}"
          TRIGGERED_BY: "${{ github.event.inputs.triggered_by }}"
        run: |
          python meteo_cnews_2/gha_send_cnews_email.py --skip-generation

      - name: Publier le ZIP sur GitHub Releases (lien de téléchargement stable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP_PATH=$(ls cartes_alertes/bulletins_cnews_patrick_*.zip | head -n 1)
          TAG="bulletins-patrick-latest"
          # Supprimer la version précédente de la release
          gh release delete "$TAG" --yes 2>/dev/null || true
          # Créer une nouvelle release avec l'archive ZIP vérifiée
          gh release create "$TAG" "$ZIP_PATH" \
            --title "Bulletins CNews Patrick - Dernière mise à jour" \
            --notes "Pack de bulletins météo CNews du $(date '+%d/%m/%Y à %Hh%M'). Contient les 32 bulletins vidéo validés et auto-vérifiés." \
            --latest
          echo "ZIP de production publié sur GitHub Releases avec succès."
